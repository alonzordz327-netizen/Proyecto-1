<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Interactivo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
            color: white;
            font-family: sans-serif;
            text-align: center;
            height: 100%; 
            width: 100%;
            position: relative; 
        }
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1; 
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0; 
            transition: opacity 1s;
        }
        
        #interact-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }
        #interact-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }
        #playButton {
            background-color: #4CAF50; 
            color: white;
            padding: 15px 30px;
            font-size: 1.5em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            transition: background-color 0.3s ease;
        }
        #playButton:hover {
            background-color: #45a049;
        }

        .menu {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
        }
        .menu a {
            color: white;
            text-decoration: none;
            font-size: 1.2em;
            padding: 10px 15px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <nav class="menu">
        <a href="index.html">Inicio</a>
    </nav>
    
    <div id="video-container">
        <video id="myVideo" src="lacobra.mp4" loop></video>
    </div>

    <div id="interact-overlay">
        <button id="playButton">tocame :></button>
    </div>

    <script src="script.js"></script>
</body>
</html>
